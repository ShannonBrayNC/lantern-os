name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  postgres:
    name: PostgreSQL migration and regression
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lantern
          POSTGRES_USER: lantern
          POSTGRES_PASSWORD: lantern
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lantern -d lantern"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LANTERN_DATABASE_URL: postgresql+psycopg://lantern:lantern@localhost:5432/lantern
      LANTERN_AUTH_MODE: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: python -m pytest -q
      - run: python -m scripts.seed

  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build

  integrated:
    name: Integrated production serving
    runs-on: ubuntu-latest
    needs: [backend, postgres, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build deployable image
        run: docker build --tag lantern-os:${{ github.sha }} .
      - name: Start Lantern OS
        run: >-
          docker run --detach --rm --name lantern-os
          -e LANTERN_AUTH_MODE=local
          -e LANTERN_SESSION_SECRET=ci-session-secret-with-at-least-32-characters
          -p 8000:8000
          lantern-os:${{ github.sha }}
      - name: Wait for health
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          docker logs lantern-os
          exit 1
      - name: Validate React, API, docs, and rollback routes
        run: |
          curl --fail --silent http://127.0.0.1:8000/ | grep -q '<div id="root"></div>'
          curl --fail --silent http://127.0.0.1:8000/api/health | grep -q '"status":"ok"'
          curl --fail --silent http://127.0.0.1:8000/docs | grep -q 'Swagger UI'
          curl --fail --silent http://127.0.0.1:8000/legacy | grep -q 'Mission Control'
          curl --fail --silent http://127.0.0.1:8000/arbitrary/spa/route | grep -q '<div id="root"></div>'
      - if: always()
        run: docker logs lantern-os || true
